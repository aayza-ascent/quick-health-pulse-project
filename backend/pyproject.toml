[project]
name = "health-pulse-backend"
version = "0.1.0"
description = "FastAPI service that turns Junction wearable summaries into baseline-relative change insights"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "httpx>=0.27",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.7",
    "mypy>=1.13",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ANN"]
ignore = ["ANN401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Put the backend root on sys.path so `app` imports resolve. Without this only
# `python -m pytest` works, because that form adds the working directory to
# sys.path while the bare `pytest` console script does not — so the suite would
# pass locally and fail in CI.
pythonpath = ["."]
filterwarnings = [
    "error",
    # Import-time deprecations from starlette's TestClient and its anyio
    # dependency. Targeted rather than blanket, so warnings raised by this
    # codebase still fail the suite.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
    "ignore:The anyio\\.abc\\..*alias is deprecated:DeprecationWarning",
]
